# Automated dependency updates: Dependabot opens a pull request whenever a
# newer version of a dependency is available; CI (tests + a full multi-arch
# image build) runs on every one of them before anything is merged.
#
# Security updates bypass the schedule and the cooldown: they are opened as
# soon as an advisory is published (Settings → Code security → Dependabot
# security updates).
version: 2
updates:
  # Python packages: pyproject.toml + uv.lock (the image installs from uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days before proposing a fresh release: brand-new versions
    # are where both regressions and supply-chain compromises surface first.
    cooldown:
      default-days: 5
      semver-major-days: 14
    # Minor/patch bumps arrive as one PR; majors stay separate for review.
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Actions are pinned to commit SHAs; Dependabot moves SHA and version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Base images in the Dockerfile (python:*-alpine, the uv build stage)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: docker
